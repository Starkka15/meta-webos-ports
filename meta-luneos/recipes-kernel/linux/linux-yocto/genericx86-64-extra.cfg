# Extra kernel config for LuneOS genericx86-64 (real hardware)
# The genericx8664 BSP already enables a broad set of drivers via linux-yocto's
# kernel metadata. This file adds anything extra needed for LuneOS on real HW.

# --- Storage ---
CONFIG_ATA=y
CONFIG_ATA_PIIX=y
CONFIG_SATA_AHCI=y
CONFIG_ATA_SFF=y
CONFIG_PATA_ACPI=y
CONFIG_BLK_DEV_NVME=y
CONFIG_NVME_CORE=y
CONFIG_USB_STORAGE=y
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PCI=y
# ACPI-enumerated SD card readers — present on virtually all modern laptops
CONFIG_MMC_SDHCI_ACPI=y
# CD/DVD drives
CONFIG_BLK_DEV_SR=y
CONFIG_CDROM=y

# --- USB ---
CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_OHCI_HCD=y
CONFIG_USB_HID=y
CONFIG_HID_GENERIC=y
CONFIG_INPUT_EVDEV=y

# --- GPU: Intel ---
CONFIG_DRM_I915=y
CONFIG_DRM_I915_GVT=n

# --- GPU: AMD ---
CONFIG_DRM_AMDGPU=y
CONFIG_DRM_AMDGPU_SI=y
CONFIG_DRM_AMDGPU_CIK=y

# --- GPU: NVIDIA (nouveau open-source) ---
CONFIG_DRM_NOUVEAU=y

# --- GPU: Generic/VESA fallback ---
# CONFIG_DRM_VESA removed in 6.x — DRM_SIMPLEDRM (below) is the replacement
CONFIG_FB_VESA=y

# --- Display/Backlight ---
CONFIG_BACKLIGHT_CLASS_DEVICE=y
# CONFIG_BACKLIGHT_GENERIC removed in 6.x — handled by platform drivers

# --- Network ---
CONFIG_E1000=y
CONFIG_E1000E=y
CONFIG_IGB=y
CONFIG_IGBVF=y
CONFIG_R8169=y
CONFIG_ATL1=y
CONFIG_ATL1C=y
CONFIG_ATL1E=y
CONFIG_VMXNET3=y

# --- WiFi ---
# CFG80211/MAC80211 built-in — framework only, no firmware dependency
CONFIG_CFG80211=y
CONFIG_MAC80211=y
# All firmware-dependent WiFi drivers as modules — built-in drivers probe
# during early PCI init before /lib/firmware/ is accessible, causing
# "no suitable firmware found" even when firmware is present on rootfs.
# Modules load via udev after rootfs is mounted and firmware is available.
CONFIG_IWLWIFI=m
CONFIG_IWLDVM=m
CONFIG_IWLMVM=m
# IWLMEI: Intel ME coexistence for WiFi 6/6E (AX201/AX210/AX211)
CONFIG_IWLMEI=m
CONFIG_ATH9K=m
CONFIG_ATH9K_HTC=m
CONFIG_ATH10K=m
CONFIG_ATH10K_PCI=m
# ATH11K: Qualcomm WiFi 6 (QCA6390, WCN6855) — common in Dell/HP with Qualcomm
CONFIG_ATH11K=m
CONFIG_ATH11K_PCI=m
# RTL8187/818x/821x legacy Realtek (rtlwifi driver)
CONFIG_RTL8187=m
CONFIG_RTL8192CE=m
CONFIG_RTL8192SE=m
CONFIG_RTL8192DE=m
CONFIG_RTL8723AE=m
CONFIG_RTL8723BE=m
CONFIG_RTL8188EE=m
CONFIG_RTL8192EE=m
CONFIG_RTL8821AE=m
CONFIG_RTL8192CU=m
# RTW88: newer Realtek driver (RTL8822BE/CE, RTL8723DE) — common in budget laptops
CONFIG_RTW88=m
CONFIG_RTW88_8822BE=m
CONFIG_RTW88_8822CE=m
CONFIG_RTW88_8723DE=m
CONFIG_RTW88_8821CE=m
# RTW89: newest Realtek driver (RTL8852AE/BE, RTL8852CE)
CONFIG_RTW89=m
CONFIG_RTW89_8852AE=m
CONFIG_RTW89_8852BE=m
# MT76/MT7921: MediaTek WiFi 6 (extremely common in Acer, Asus, Lenovo)
CONFIG_MT76=m
CONFIG_MT76_USB=m
CONFIG_MT76_CONNAC_LIB=m
CONFIG_MT7921_COMMON=m
CONFIG_MT7921E=m
CONFIG_MT7921U=m
CONFIG_BRCMFMAC=m
CONFIG_MT7601U=m

# --- Bluetooth ---
CONFIG_BT=y
CONFIG_BT_HCIBTUSB=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_BNEP=y
CONFIG_BT_HIDP=y
# Intel BT coexistence (for iwlwifi combo cards)
CONFIG_BT_INTEL=y
# Broadcom USB BT (many Lenovo/HP/Asus laptops)
CONFIG_BT_HCIBTUSB_BCM=y
# MediaTek USB BT (MT7921 combo)
CONFIG_BT_HCIBTUSB_MTK=y
# UHID: userspace HID — required by BlueZ for BT HID (keyboards, mice)
CONFIG_UHID=y

# --- Sound ---
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_HDA_INTEL=y
CONFIG_SND_HDA_CODEC_REALTEK=y
CONFIG_SND_HDA_CODEC_ANALOG=y
CONFIG_SND_HDA_CODEC_SIGMATEL=y
CONFIG_SND_HDA_CODEC_VIA=y
CONFIG_SND_HDA_CODEC_HDMI=y
CONFIG_SND_HDA_CODEC_CIRRUS=y
CONFIG_SND_HDA_CODEC_CONEXANT=y
CONFIG_SND_HDA_CODEC_CA0110=y
CONFIG_SND_HDA_CODEC_CA0132=y
CONFIG_SND_HDA_CODEC_CMEDIA=y
CONFIG_SND_HDA_CODEC_SI3054=y
CONFIG_SND_USB_AUDIO=y
CONFIG_SND_AC97_CODEC=y

# --- Input ---
CONFIG_INPUT_KEYBOARD=y
CONFIG_INPUT_MOUSE=y
CONFIG_MOUSE_PS2=y
CONFIG_KEYBOARD_ATKBD=y
CONFIG_SERIO=y
CONFIG_SERIO_I8042=y

# --- Touch / Digitizer ---
# INPUT_TOUCHSCREEN: touchscreen framework (not in common-pc-64 standard configs)
CONFIG_INPUT_TOUCHSCREEN=y
# HID_MULTITOUCH: generic HID multitouch — covers 3M, Cypress, Stantum, etc.
CONFIG_HID_MULTITOUCH=y
# HID_EGALAX: eGalax USB HID touchscreen (DT Research DT301Y VID:0EEF)
CONFIG_HID_EGALAX=y
# HID_ELAN: Elan touchpad/touchscreen (common in Asus, HP, Lenovo)
CONFIG_HID_ELAN=y
# TOUCHSCREEN_USB_COMPOSITE: USB composite touchscreens (includes eGalax protocol)
CONFIG_TOUCHSCREEN_USB_COMPOSITE=y
# I2C_HID: I2C-attached HID devices — all modern laptop touchpads/touchscreens
CONFIG_I2C_HID=y
CONFIG_I2C_HID_ACPI=y
# Intel LPSS I2C DesignWare — the bus controller for I2C HID devices on Intel
CONFIG_I2C_DESIGNWARE_PLATFORM=y
CONFIG_I2C_DESIGNWARE_BAYTRAIL=y

# --- ACPI / Power ---
CONFIG_ACPI=y
CONFIG_ACPI_BATTERY=y
CONFIG_ACPI_AC=y
CONFIG_ACPI_BUTTON=y
CONFIG_ACPI_THERMAL=y
CONFIG_ACPI_FAN=y
CONFIG_ACPI_PROCESSOR=y
CONFIG_X86_ACPI_CPUFREQ=y
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
CONFIG_CPU_FREQ_GOV_ONDEMAND=y
CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y
CONFIG_CPU_FREQ_GOV_USERSPACE=y
CONFIG_CPU_FREQ_STAT=y
CONFIG_X86_INTEL_PSTATE=y
# ACPI_WMI: ACPI WMI interface — needed for Dell/HP/Lenovo BIOS management,
#           rotation sensors, and many platform-specific quirks
CONFIG_ACPI_WMI=y
CONFIG_WMI_BMOF=y
# ACPI sleep states (S3/S4) — not enabled by default in Yocto standard BSP
CONFIG_ACPI_SLEEP=y
CONFIG_SUSPEND=y
CONFIG_HIBERNATION=y

# --- Power Management ---
CONFIG_PM_SLEEP=y
# INTEL_IDLE: Intel native cpuidle — reduces idle power significantly on Intel
CONFIG_INTEL_IDLE=y

# --- Thermal ---
CONFIG_THERMAL=y
CONFIG_THERMAL_HWMON=y
CONFIG_X86_PKG_TEMP_THERMAL=y
CONFIG_INTEL_POWERCLAMP=y
# Intel PCH thermal (Tiger Lake, Ice Lake, etc.)
CONFIG_INTEL_PCH_THERMAL=m

# --- Intel Platform Drivers ---
# X86_PLATFORM_DEVICES: gate for all Intel platform-specific drivers
CONFIG_X86_PLATFORM_DEVICES=y
# Intel PMC Core: Power Management Controller (needed for S0ix sleep on Tiger Lake+)
CONFIG_INTEL_PMC_CORE=y
# Intel HID event driver: 2-in-1 rotation/tablet-mode events (Surface, Yoga, etc.)
CONFIG_INTEL_HID_EVENT=y

# --- Firmware loading ---
CONFIG_FW_LOADER=y
CONFIG_FW_LOADER_USER_HELPER=y
CONFIG_FW_LOADER_USER_HELPER_FALLBACK=n

# --- EFI ---
CONFIG_EFI=y
CONFIG_EFI_STUB=y
# CONFIG_EFI_VARS removed in 5.13 — use efivarfs instead
CONFIG_EFIVAR_FS=y
CONFIG_FB_EFI=y
CONFIG_DRM_SIMPLEDRM=y

# --- PCIe ---
CONFIG_PCIEPORTBUS=y
CONFIG_PCIEASPM=y
CONFIG_PCIEAER=y
CONFIG_HOTPLUG_PCI=y
CONFIG_HOTPLUG_PCI_PCIE=y

# --- Filesystems ---
# These are NOT included in the standard linux-yocto common-pc-64 configs.
# Standard.cfg has FAT_FS=y and CIFS=y; add modern filesystems below.
# BTRFS: increasingly used as default FS on Fedora; needed for modern USB drives
CONFIG_BTRFS_FS=y
CONFIG_BTRFS_FS_POSIX_ACL=y
# exFAT: FAT replacement on SD cards >32GB, USB drives formatted on Windows/macOS
CONFIG_EXFAT_FS=y
# NTFS3: mainline read/write NTFS driver (landed 5.15) — for Windows partitions
CONFIG_NTFS3_FS=y
# VFAT: long filenames on FAT — EFI partition, most USB drives from any OS
CONFIG_VFAT_FS=y
# SquashFS: compressed read-only FS — used by live images, snaps, OTA
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_XATTR=y
CONFIG_SQUASHFS_FILE_CACHE=y
# TMPFS POSIX ACL: needed by systemd for /run, /tmp with ACL permissions
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y
# OverlayFS: needed for containers (Docker, podman) and some update systems
CONFIG_OVERLAY_FS=y

# --- Webcam / Media ---
# UVC: USB Video Class — covers all modern webcams (Logitech, Microsoft, built-in)
CONFIG_MEDIA_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_VIDEO_V4L2=y
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_USB_VIDEO_CLASS=m
CONFIG_USB_VIDEO_CLASS_INPUT_EVDEV=y

# --- USB Networking ---
# For phone tethering (Android RNDIS, iPhone CDC) and USB network adapters
CONFIG_USB_NET_RNDIS_HOST=m
CONFIG_USB_NET_CDC_NCM=m
CONFIG_USB_NET_CDCETHER=m
# QMI WWAN: 4G/LTE USB modems (Quectel, Sierra, Huawei)
CONFIG_USB_NET_QMI_WWAN=m

# --- IIO Sensors ---
# Required for accelerometers, gyros, ambient light in tablets and 2-in-1s
CONFIG_IIO=y
CONFIG_IIO_BUFFER=y
CONFIG_IIO_TRIGGERED_BUFFER=y
# BMC150: Intel/ST accelerometer (common in Bay Trail, Cherry Trail tablets)
CONFIG_BMC150_ACCEL=m
CONFIG_BMC150_ACCEL_I2C=m
CONFIG_BMC150_ACCEL_SPI=m
# KXCJK1013: Kionix/Rohm accelerometer (common in Asus, Lenovo tablets)
CONFIG_KXCJK1013=m
# Ambient light sensor (ACPI ALS — many tablets/laptops)
CONFIG_ACPI_ALS=m
CONFIG_SENSORS_LM90=m

# --- Verbose boot / debug visibility ---
# Ensure kernel messages are printed to the console from early boot.
# These are safe for production builds — they add no overhead when nothing
# is listening, and they make diagnosing hardware bring-up problems possible
# without serial console access.
CONFIG_PRINTK=y
CONFIG_PRINTK_CALLER=y
CONFIG_EARLY_PRINTK=y
CONFIG_EARLY_PRINTK_DBGP=y
CONFIG_X86_VERBOSE_BOOTUP=y
# DRM connector/mode reporting — helps diagnose display size detection issues
CONFIG_DRM_KMS_HELPER=y
# CONFIG_DRM_KMS_FB_HELPER merged into DRM_KMS_HELPER in 6.x
CONFIG_DRM_FBDEV_EMULATION=y
