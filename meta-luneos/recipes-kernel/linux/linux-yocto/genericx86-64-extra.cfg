# Extra kernel config for LuneOS genericx86-64 (real hardware)
# The genericx8664 BSP already enables a broad set of drivers via linux-yocto's
# kernel metadata. This file adds anything extra needed for LuneOS on real HW.

# --- Storage ---
CONFIG_ATA=y
CONFIG_ATA_PIIX=y
CONFIG_AHCI=y
CONFIG_SATA_AHCI=y
CONFIG_ATA_SFF=y
CONFIG_PATA_ACPI=y
CONFIG_BLK_DEV_NVME=y
CONFIG_NVME_CORE=y
CONFIG_USB_STORAGE=y
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PCI=y

# --- USB ---
CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_OHCI_HCD=y
CONFIG_USB_HID=y
CONFIG_HID_GENERIC=y
CONFIG_INPUT_EVDEV=y

# --- GPU: Intel ---
CONFIG_DRM_I915=y
CONFIG_DRM_I915_GVT=n

# --- GPU: AMD ---
CONFIG_DRM_AMDGPU=y
CONFIG_DRM_AMDGPU_SI=y
CONFIG_DRM_AMDGPU_CIK=y

# --- GPU: NVIDIA (nouveau open-source) ---
CONFIG_DRM_NOUVEAU=y

# --- GPU: Generic/VESA fallback ---
CONFIG_DRM_VESA=y
CONFIG_FB_VESA=y

# --- Display/Backlight ---
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_BACKLIGHT_GENERIC=y

# --- Network ---
CONFIG_E1000=y
CONFIG_E1000E=y
CONFIG_IGB=y
CONFIG_IGBVF=y
CONFIG_R8169=y
CONFIG_ATL1=y
CONFIG_ATL1C=y
CONFIG_ATL1E=y
CONFIG_VMXNET3=y

# --- WiFi ---
CONFIG_CFG80211=y
CONFIG_MAC80211=y
CONFIG_IWLWIFI=y
CONFIG_IWLDVM=y
CONFIG_IWLMVM=y
CONFIG_ATH9K=y
CONFIG_ATH9K_HTC=y
CONFIG_ATH10K=y
CONFIG_ATH10K_PCI=y
CONFIG_RTL8187=y
CONFIG_RTL8192CE=y
CONFIG_RTL8192SE=y
CONFIG_RTL8192DE=y
CONFIG_RTL8723AE=y
CONFIG_RTL8723BE=y
CONFIG_RTL8188EE=y
CONFIG_RTL8192EE=y
CONFIG_RTL8821AE=y
CONFIG_RTL8192CU=y
CONFIG_BRCMFMAC=y
CONFIG_MT7601U=y

# --- Bluetooth ---
CONFIG_BT=y
CONFIG_BT_HCIBTUSB=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_BNEP=y
CONFIG_BT_HIDP=y

# --- Sound ---
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_HDA_INTEL=y
CONFIG_SND_HDA_CODEC_REALTEK=y
CONFIG_SND_HDA_CODEC_ANALOG=y
CONFIG_SND_HDA_CODEC_SIGMATEL=y
CONFIG_SND_HDA_CODEC_VIA=y
CONFIG_SND_HDA_CODEC_HDMI=y
CONFIG_SND_HDA_CODEC_CIRRUS=y
CONFIG_SND_HDA_CODEC_CONEXANT=y
CONFIG_SND_HDA_CODEC_CA0110=y
CONFIG_SND_HDA_CODEC_CA0132=y
CONFIG_SND_HDA_CODEC_CMEDIA=y
CONFIG_SND_HDA_CODEC_SI3054=y
CONFIG_SND_USB_AUDIO=y
CONFIG_SND_AC97_CODEC=y

# --- Input ---
CONFIG_INPUT_KEYBOARD=y
CONFIG_INPUT_MOUSE=y
CONFIG_MOUSE_PS2=y
CONFIG_KEYBOARD_ATKBD=y
CONFIG_SERIO=y
CONFIG_SERIO_I8042=y

# --- ACPI / Power ---
CONFIG_ACPI=y
CONFIG_ACPI_BATTERY=y
CONFIG_ACPI_AC=y
CONFIG_ACPI_BUTTON=y
CONFIG_ACPI_THERMAL=y
CONFIG_ACPI_FAN=y
CONFIG_ACPI_PROCESSOR=y
CONFIG_ACPI_CPUFREQ=y
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
CONFIG_X86_INTEL_PSTATE=y

# --- Thermal ---
CONFIG_THERMAL=y
CONFIG_THERMAL_HWMON=y
CONFIG_X86_PKG_TEMP_THERMAL=y
CONFIG_INTEL_POWERCLAMP=y

# --- Firmware loading ---
CONFIG_FW_LOADER=y
CONFIG_FW_LOADER_USER_HELPER=y
CONFIG_FW_LOADER_USER_HELPER_FALLBACK=n

# --- EFI ---
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFI_VARS=y
CONFIG_FB_EFI=y
CONFIG_DRM_SIMPLEDRM=y
