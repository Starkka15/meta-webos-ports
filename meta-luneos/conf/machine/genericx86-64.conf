#@TYPE: Machine
#@NAME: Generic x86-64

#@DESCRIPTION: Generic 64-bit x86 machine configuration for real hardware (Intel and AMD).
# Targets any x86-64 CPU from roughly Core2/Phenom era onward.
# Uses linux-yocto genericx8664 BSP for broad driver coverage.
# Produces EFI-bootable wic disk images and live ISO images.

DEFAULTTUNE ?= "core2-64"
require conf/machine/include/x86/tune-core2.inc
require conf/machine/include/x86/x86-base.inc

# Tell linux-yocto to use the real-hardware genericx8664 BSP
# (much broader driver coverage than qemux86-64 BSP)
KMACHINE ?= "common-pc-64"

# linux-yocto 6.6 standard/base covers genericx8664
KBRANCH ?= "v6.6/standard/base"

# Prefer linux-yocto (works on both Intel and AMD).
# meta-intel.inc would force linux-intel (Intel-only); we don't want that.
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"

# EFI + legacy BIOS fallback
MACHINE_FEATURES += "efi pcbios acpi wifi bluetooth"

KERNEL_IMAGETYPE = "bzImage"
EFI_PROVIDER ?= "grub-efi"

SERIAL_CONSOLES ?= "115200;ttyS0"
APPEND += "rootwait"

# Mesa for Intel (iris/crocus) + AMD (radeonsi) + NVIDIA (nouveau) + software fallback
PREFERRED_PROVIDER_virtual/libgl ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles1 ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles2 ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles3 ?= "mesa"

# X11 video drivers (used by any X11 fallback path)
XSERVER ?= "${XSERVER_X86_BASE} \
            ${XSERVER_X86_EXT} \
            ${XSERVER_X86_FBDEV} \
            ${XSERVER_X86_I915} \
            ${XSERVER_X86_I965} \
            ${XSERVER_X86_MODESETTING} \
            ${XSERVER_X86_VESA} \
           "

# kernel-modules, linux-firmware and intel-microcode are added in the image
# recipe (luneos-live-image.bb) rather than here to avoid pulling them into
# core-image-minimal-initramfs which has a strict 128MB size limit.

# Default image type: EFI+rootfs disk image (dd to USB or used by installer)
# live ISO is only set in luneos-live-image.bb to avoid leaking into initramfs recipes
IMAGE_FSTYPES ?= "tar.gz wic"

WKS_FILE ?= "luneos-genericx86-64.wks"

do_image_wic[depends] += "grub-efi:do_deploy grub-efi-native:do_populate_sysroot mtools-native:do_populate_sysroot dosfstools-native:do_populate_sysroot"
